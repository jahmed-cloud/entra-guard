# ============================================================================
# EntraGuard — Single Stack
# Works locally (port 3000) and in production (port 80)
# cp .env.example .env && nano .env && docker compose up -d
# ============================================================================

# Container hardening shared by the services below.
# - no-new-privileges: a process can't gain privileges through setuid binaries.
# - cap_drop ALL (our own Python services only): they need no Linux
#   capabilities. Postgres, Redis and nginx keep the defaults because their
#   entrypoints start as root and then drop to an unprivileged user.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true

x-hardened-app: &hardened-app
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  postgres:
    <<: *hardened
    image: postgres:16-alpine
    container_name: entra-guard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cspm}
      POSTGRES_USER: ${POSTGRES_USER:-cspm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cspm_user} -d ${POSTGRES_DB:-cspm}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    <<: *hardened
    image: redis:7-alpine
    container_name: entra-guard-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    <<: *hardened-app
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: entra-guard-api
    restart: unless-stopped
    # The dashboard reaches the API through the web-ui container, so this port
    # is only for scripts/curl on the host itself. Bound to localhost on
    # purpose: published on all interfaces it let anyone on the network
    # bypass nginx (and its client-IP header, which the login rate limiter
    # trusts from private addresses). Use "${API_PORT:-8000}:8000" only if you
    # need remote API access, ideally behind a firewall.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cspm_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cspm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}

      ENTRA_TENANT_ID: ${AZURE_TENANT_ID}
      ENTRA_CLIENT_ID: ${AZURE_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}

      SECRET_KEY: ${SECRET_KEY:-changeme}
      TARGET_NAME: ${TARGET_NAME:-My Azure Tenant}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOCAL_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME:-admin}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
      MSAL_ADMIN_USERS: ${MSAL_ADMIN_USERS:-}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      SCAN_STALE_MINUTES: ${SCAN_STALE_MINUTES:-60}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INSTANCE_NAME: ${INSTANCE_NAME:-EntraGuard}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}

    volumes:
      - users_data:/app/data

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - external

  assessment-engine:
    <<: *hardened-app
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: entra-guard-worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cspm_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cspm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}

      ENTRA_TENANT_ID: ${AZURE_TENANT_ID}
      ENTRA_CLIENT_ID: ${AZURE_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}

      AI_EXPLAIN_ENABLED: ${AI_EXPLAIN_ENABLED:-false}
      AI_EXPLAIN_PROVIDER: ${AI_EXPLAIN_PROVIDER:-anthropic}
      AI_EXPLAIN_MAX_PER_SCAN: ${AI_EXPLAIN_MAX_PER_SCAN:-30}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      AI_AGENT_MAX_TOOL_CALLS: ${AI_AGENT_MAX_TOOL_CALLS:-3}
      AI_AGENT_MAX_FINDINGS_PER_SCAN: ${AI_AGENT_MAX_FINDINGS_PER_SCAN:-5}
      AI_AGENT_MODEL_GROQ: ${AI_AGENT_MODEL_GROQ:-}
      AI_AGENT_MODEL_OLLAMA: ${AI_AGENT_MODEL_OLLAMA:-}
      AI_AGENT_MODEL_OPENAI: ${AI_AGENT_MODEL_OPENAI:-}
      AI_AGENT_MAX_SECONDS_PER_FINDING: ${AI_AGENT_MAX_SECONDS_PER_FINDING:-90}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_EXPLAIN_MODEL_ANTHROPIC: ${AI_EXPLAIN_MODEL_ANTHROPIC:-}
      AI_EXPLAIN_MODEL_OPENAI: ${AI_EXPLAIN_MODEL_OPENAI:-}
      AI_EXPLAIN_MODEL_GROQ: ${AI_EXPLAIN_MODEL_GROQ:-}
      AI_EXPLAIN_MODEL_OLLAMA: ${AI_EXPLAIN_MODEL_OLLAMA:-}
      AI_EXPLAIN_CHECK_IDS: ${AI_EXPLAIN_CHECK_IDS:-}

    extra_hosts:
      # Required on Linux Docker hosts for host.docker.internal to resolve —
      # Docker Desktop (Mac/Windows) provides this automatically, but native
      # Linux Docker does not. Harmless no-op if you're not using Ollama.
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - external

  scheduler:
    <<: *hardened-app
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: entra-guard-scheduler
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cspm_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cspm}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - external

  web-ui:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: entra-guard-ui
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
    internal: true

  external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  users_data:
