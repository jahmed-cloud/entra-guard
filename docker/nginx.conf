server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server_tokens off;            # don't advertise the nginx version
    client_max_body_size 1m;      # every API request body is small JSON

    # API_HOST is resolved via Docker DNS — works with any container name
    # on the same Docker network
    resolver 127.0.0.11 valid=30s;

    # No add_header here on purpose: the API sets its own security headers
    # (services/api/app/main.py), and adding them again would duplicate them.
    location /api/ {
        set $api_host "api";
        proxy_pass http://$api_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        # Security headers for the dashboard itself.
        # - CSP: scripts only from this origin (no inline, no eval), so an
        #   injected <script> can't run or reach the token in localStorage.
        #   Styles allow 'unsafe-inline' because the UI uses React inline
        #   styles; fonts come from Google Fonts (see index.html).
        # - frame-ancestors/X-Frame-Options: the dashboard can't be framed
        #   (clickjacking on "Run scan", user management).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
